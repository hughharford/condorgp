# TEMPLATE ONLY. Documents the shape of the Secret; safe to commit.
# NEVER put real values in this file.
#
# The real Secret lives, SOPS-encrypted, in 02-secrets.enc.yaml.
# Create it with generated random values:
#   bash k8s/secrets/secrets.sh init        # once: age key + recipient
#   bash k8s/secrets/secrets.sh generate
# Guide: kubernetes/secrets_management.md
#
# What each key is used by:
#   postgres-password       cgp-database   POSTGRES_PASSWORD (superuser)
#   app-db-pass             cgp-database   APP_DB_PASS (application role, created by the init script)
#   rabbitmq-user           rabbitmq, master, worker(s)
#   rabbitmq-pass           rabbitmq, master, worker(s)
#   grafana-admin-password  cgp-grafana    GF_SECURITY_ADMIN_PASSWORD (first start only)
apiVersion: v1
kind: Secret
metadata:
  name: cgp-secrets
  namespace: cgp-system
type: Opaque
stringData:
  postgres-password: CHANGEME
  app-db-pass: CHANGEME
  rabbitmq-user: CHANGEME
  rabbitmq-pass: CHANGEME
  grafana-admin-password: CHANGEME
