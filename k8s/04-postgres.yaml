# First-boot database initialisation script.
# This is a COPY of scripts/db_init/01-init.sh (also used by Docker Compose).
# If you change one, change the other. It runs only when the data volume is
# empty; see the header of the script for details.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cgp-db-init
  namespace: cgp-system
data:
  01-init.sh: |
    #!/bin/bash
    # Postgres first-boot initialisation.
    #
    # Mounted at /docker-entrypoint-initdb.d/ by:
    #   - Kubernetes: ConfigMap "cgp-db-init" in k8s/04-postgres.yaml
    #   - Docker Compose: docker_compose/docker-compose-db-graf-rmq.yml
    # KEEP THE TWO IN SYNC: the ConfigMap holds a copy of this file.
    #
    # The official postgres image runs these scripts ONLY when the data directory
    # is empty (first start of a fresh volume). Changing this file does not alter an
    # existing database; to re-run it, delete the PVC / volume (this destroys data).
    #
    # Required environment (supplied from the cgp-secrets Secret / cgp-config):
    #   APP_DB_USER  application role to create
    #   APP_DB_PASS  its password
    #   APP_DB_NAME  application database (created if missing, owned by that role)
    #
    # The image creates $POSTGRES_DB itself before running this script. In this repo
    # POSTGRES_DB and APP_DB_NAME are the same name, so the database usually EXISTS by
    # now: the script creates it only if it is missing, and then hands it to the
    # application role either way.
    #
    # Values are passed to psql as variables and quoted by psql itself
    # (:"x" as an identifier, :'x' as a literal), so odd characters in a password
    # cannot break or inject into the SQL.

    set -euo pipefail

    : "${APP_DB_USER:?APP_DB_USER must be set}"
    : "${APP_DB_PASS:?APP_DB_PASS must be set}"
    : "${APP_DB_NAME:?APP_DB_NAME must be set}"

    psql -v ON_ERROR_STOP=1 \
         --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
         -v app_user="$APP_DB_USER" \
         -v app_pass="$APP_DB_PASS" \
         -v app_db="$APP_DB_NAME" <<'EOSQL'
    CREATE ROLE :"app_user" WITH LOGIN PASSWORD :'app_pass';

    SELECT format('CREATE DATABASE %I', :'app_db')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'app_db')
    \gexec

    ALTER DATABASE :"app_db" OWNER TO :"app_user";
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgp-database
  namespace: cgp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgp-database
  template:
    metadata:
      labels:
        app: cgp-database
    spec:
      containers:
      - name: postgres
        image: postgres:14.2
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 5432
        env:
        # # NB in .env:
          # POSTGRES_USER=postgres # ? do ${POSTGRES_USER}, ${APP_DB_USER}, ${APP_DB_NAME} work
          # POSTGRES_PASSWORD=postgres
          # APP_DB_NAME=cgpbackbone

# CHECKLIST
          # POSTGRES_PASSWORD
          # POSTGRES_USER
          # POSTGRES_DB
          # APP_DB_USER
          # APP_DB_PASS
          # APP_DB_NAME

        # POSTGRES_PASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cgp-secrets
              key: postgres-password  # value lives in the SOPS-encrypted k8s/02-secrets.enc.yaml
        # APP_DB_PASS
        - name: APP_DB_PASS
          valueFrom:
            secretKeyRef:
              name: cgp-secrets
              key: app-db-pass  # value lives in the SOPS-encrypted k8s/02-secrets.enc.yaml
        # APP_DB_USER
        - name: APP_DB_USER         # cgp-config set in 01-configmap
          valueFrom:
            configMapKeyRef:
              name: cgp-config
              key: APP_DB_USER #   APP_DB_USER: ${APP_DB_USER} cf 01-configmap.yaml
        # APP_DB_NAME
        - name: APP_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: cgp-config
              key: APP_DB_NAME #  APP_DB_NAME: ${APP_DB_NAME}  cf 01-configmap.yaml
        # POSTGRES_USER
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: cgp-config
              key: POSTGRES_USER # POSTGRES_USER: ${POSTGRES_USER} cf 01-configmap.yaml
        # POSTGRES_DB
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: cgp-config
              key: POSTGRES_DB #   cf 01-configmap.yaml

        volumeMounts:
        - name: postgres-data
          mountPath: host-data-postgres
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d/
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init-scripts
        configMap:
          name: cgp-db-init
          defaultMode: 0555

---
apiVersion: v1
kind: Service
metadata:
  name: cgp-database
  namespace: cgp-system
spec:
  type: NodePort
  selector:
    app: cgp-database
  ports:
  - port: 5432
    targetPort: 5432
