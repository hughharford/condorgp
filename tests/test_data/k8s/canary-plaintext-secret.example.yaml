# CANARY: a deliberately BAD Kubernetes Secret that must always stay in the repo.
#
# Tests 017 (topic A) use it to prove the secret checks can FAIL: the plaintext check must
# flag it, and the default-password check must flag the default credentials in it. If someone
# encrypts, empties or deletes it, a test fails and says why, so the checks cannot quietly
# become vacuous.
#
# Every value is fake. Do not replace them with real ones. Do not encrypt this file.
# It is named *.example.yaml so `k8s/secrets/secrets.sh check` skips it, and it lives under
# tests/, which the repository scan never reads, so it does not trip the real checks.
apiVersion: v1
kind: Secret
metadata:
  name: canary-not-a-real-secret
  namespace: canary
type: Opaque
data:
  postgres-password: cG9zdGdyZXM=   # "postgres": a well-known default, base64 encoded
stringData:
  app-db-pass: cgp-pass             # a well-known default, in the clear
  canary-token: FAKE-NOT-A-REAL-SECRET-0000
